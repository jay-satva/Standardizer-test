<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- <link rel="stylesheet" href="/Javascript/style.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex min-vh-100 align-items-center justify-content-center">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        <div class="col-12 text-center">
                            <div class="fs-1 text-primary">Login</div>
                        </div>
                    </div>
                    <form id="submitForm" action="">
                        <div class="row">
                            <div class="col-12 mt-3">
                                <div>
                                    <h6>Email</h6>
                                    <input type="email" class="form-control" name="email" id="email" required>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <div>
                                    <h6>Password</h6>
                                    <input type="password" placeholder="123" class="form-control" name="password" id="password" required>
                                </div>
                            </div>
                            <div class="col-4 mt-3">
                            <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
